<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let CFG=null,VAULT=null,ROLES={},S=null,heroT=null,pollT=null,FLASH='';
const POLL_MS=window.POLL_MS||20000,norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
try{S=JSON.parse(sessionStorage.getItem('medsess'))}catch(e){}
const saveS=()=>{try{S?sessionStorage.setItem('medsess',JSON.stringify(S)):sessionStorage.removeItem('medsess')}catch(e){}};
const rand=n=>[...crypto.getRandomValues(new Uint8Array(n))].map(x=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x%32]).join('');
// ---- шифрование (WebCrypto) ----
const te=new TextEncoder(),td=new TextDecoder();
const b64=u=>{let s='';const a=new Uint8Array(u);for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)},unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const u8b64=t=>btoa(unescape(encodeURIComponent(t))),b64u8=s=>decodeURIComponent(escape(atob(s.replace(/\s/g,''))));
const derive=async(key,salt)=>{const m=await crypto.subtle.importKey('raw',te.encode(key),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])};
async function seal(key,obj){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),k=await derive(key,salt);const c=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,te.encode(JSON.stringify(obj)));return{s:b64(salt),i:b64(iv),c:b64(c)}}
async function unseal(key,e){try{const k=await derive(key,unb64(e.s));return JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(e.i)},k,unb64(e.c))))}catch(x){return null}}
const AL='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*?+=-',genKey=()=>{const a=new Uint32Array(36);crypto.getRandomValues(a);return[...a].map(x=>AL[x%AL.length]).join('')};
const newDK=()=>b64(crypto.getRandomValues(new Uint8Array(32))),dkImport=b=>crypto.subtle.importKey('raw',unb64(b),'AES-GCM',false,['encrypt','decrypt']);
async function encB(dk,bytes){const iv=crypto.getRandomValues(new Uint8Array(12));return{iv:b64(iv),c:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},dk,bytes))}}
async function decB(dk,o){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},dk,unb64(o.c)))}
const encJ=(dk,obj)=>encB(dk,te.encode(JSON.stringify(obj))),decJ=async(dk,o)=>JSON.parse(td.decode(await decB(dk,o)));
const packS=async o=>{const k=S&&S.dk&&S.dk._s;return JSON.stringify(k?await encJ(await dkImport(k),o):o)};
const unpackS=async t=>{const j=JSON.parse(t);if(j&&j.iv&&j.c){const k=S&&S.dk&&S.dk._s;if(!k)throw new Error('нет ключа состояния');return decJ(await dkImport(k),j)}return j};
const normKeys=k=>{const o={};for(const r of Object.keys(ROLES)){const v=(k||{})[r];o[r]=Array.isArray(v)?v.slice():(v?[v]:[])}return o};
const slotsOf=r=>ROLES[r].kind==='worker'?15:1;
async function buildVault(keys,wh,db,dk,onp){const entries=[],tot=Object.keys(ROLES).reduce((a,r)=>a+keys[r].length,0);let n=0;
 for(const r of Object.keys(ROLES)){const R=ROLES[r];let hooks={},dks={};if(R.kind==='admin'){hooks={...wh};dks={...dk}}else{if(wh[R.dept])hooks={[R.dept]:wh[R.dept]};dks={[R.dept]:dk[R.dept],_s:dk._s}}
  for(let i=0;i<keys[r].length;i++){const p={role:r,n:i+1,webhooks:hooks,db:db||null,dk:dks};if(r==='chief')p.keys=keys;entries.push({r,n:i+1,...await seal(keys[r][i],p)});n++;if(onp)onp(n,tot)}}
 return{v:2,entries}}
// ---- звук и анимация нажатия ----
let AC=null,mute=false;try{mute=localStorage.getItem('medmute')==='1'}catch(e){}
const tone=(f,d=.08,v=.05,t0=0,to)=>{if(mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(to||f*.82,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}};
const sOk=()=>{tone(620,.1,.05);tone(830,.14,.05,.09)},sErr=()=>tone(180,.22,.06,0,120);
document.addEventListener('click',e=>{const t=e.target.closest('button,.card.click,nav a,.go');if(!t)return;tone(t.classList.contains('ghost')?420:560,.07,.045);

const SL=[['Единый портал','MED<br>DEPARTAMENTS','Современный и удобный портал медицинских отделов: регистрация сотрудников, формы и архивы в одном месте.','Войти','login'],
['Отделы','СЕМЬ<br>ОТДЕЛОВ','Морг, Псих.Диспансер, Военные врачи, Лаборатория, Школьные врачи, Терапевтическое отделение и Отдел персонала.','Выбрать отдел','depts'],
['Архивы','АРХИВ<br>ПО ФОРМЕ','Заполните форму своего отдела, и архив автоматически отправится в канал отдела.','Начать','login']];

 CFG.departments.forEach(d=>{ROLES[d.id+'_worker']={id:d.id+'_worker',name:d.worker,dept:d.id,kind:'worker'};if(d.head)ROLES[d.id+'_head']={id:d.id+'_head',name:d.head,dept:d.id,kind:'head'}});CFG.admins.forEach(a=>ROLES[a.id]={id:a.id,name:a.name,dept:null,kind:'admin'});
 if(S){const en=VAULT.entries.find(x=>x.r===S.role&&x.s===S.vs);if(!en){S=null;saveS()}}}

 el.innerHTML=`<div class="card"><h3>Сеансы за последние два дня</h3><small>Завершённый сеанс выбрасывает человека из аккаунта в течение ~${Math.round(POLL_MS/1000)} секунд (когда его страница обратится к хранилищу).</small><div class="row" style="margin-top:12px"><button class="btn sm danger" id="all">Завершить все сеансы сотрудников</button></div><div style="overflow-x:auto"><table style="margin-top:10px"><tr><th>Ник</th><th>Должность</th><th>Ключ</th><th>Вход</th><th>Статус</th><th></th></tr>${rows.map((s,i)=>{const t=st(s);return `<tr><td>${esc(s.nick)}</td><td>${esc(s.roleName)}<br><span class="mu">${esc(s.deptName)}</span></td><td>№${s.keyNo}</td><td>${fmt(s.started)}</td><td>${t}</td><td>${t==='в сети'&&s.sid!==S.sid?`<button class="btn ghost sm" data-k="${i}">Завершить</button> <button class="btn danger sm" data-b="${i}">Завершить и отключить ключ</button>`:''}</td></tr>`}).join('')||'<tr><td colspan=6 class="mu">Сеансов пока нет.</td></tr>'}</table></div></div>
 <div class="card" style="margin-top:14px"><h3>Отключённые ключи</h3>${bans.length?bans.map(k=>`<div class="row" style="margin-top:8px"><span>${esc((ROLES[k.split('#')[0]]||{}).name||k)} · ключ №${esc(k.split('#')[1])}</span><button class="btn ghost sm" data-u="${esc(k)}">Включить</button></div>`).join(''):'<p class="mu">Нет отключённых ключей.</p>'}</div><div class="err" id="se"></div>`;
 const act=async(fn)=>{try{await updRev(fn);sOk();tSess()}catch(e){$('#se').textContent='Ошибка: '+e.message;sErr()}};
 document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const s=rows[+b.dataset.k];act(d=>{d.sids[s.sid]=Date.now()})});
 document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const s=rows[+b.dataset.b];act(d=>{d.sids[s.sid]=Date.now();d.banned[s.role+'#'+s.keyNo]=Date.now()})});
 document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>act(d=>{delete d.banned[b.dataset.u]}));
 $('#all').onclick=()=>act(d=>{d.all=Date.now()})}
// ---- настройка (Главный врач) ----
async function tSetup(){const el=$('#tab');if(!S.keys){el.innerHTML='<p class="err">Нет доступа.</p>';return}
 const keys=normKeys(S.keys),wh={...S.webhooks},db0=S.db||{repo:'',token:'',branch:'main'},dk={...S.dk};let fresh=0;
 for(const r of Object.keys(ROLES))while(keys[r].length<slotsOf(r)){keys[r].push(genKey());fresh++}
 CFG.departments.forEach(d=>{if(!dk[d.id])dk[d.id]=newDK()});if(!dk._s)dk._s=newDK();
 const rl=Object.values(ROLES).map(r=>({...r,dn:r.dept?CFG.departments.find(d=>d.id===r.dept).name:'Администрация'}));
 el.innerHTML=`<div class="card"><h3>Вебхуки Discord по отделам</h3><small>Вставьте ссылку вебхука канала каждого отдела.</small><table style="margin-top:10px">${CFG.departments.map(d=>`<tr><td style="width:190px">${esc(d.name)}</td><td><input data-h="${d.id}" value="${esc(wh[d.id]||'')}" placeholder="https://discord.com/api/webhooks/…"></td><td style="width:110px"><button class="btn ghost sm" data-ht="${d.id}">Проверить</button></td></tr>`).join('')}</table><div class="err" id="he"></div></div>
 <div class="card" style="margin-top:14px"><h3>Хранилище данных (приватный репозиторий GitHub)</h3><small>Нужно для общего списка архивов, удаления, отслеживания и завершения сеансов. Создайте приватный репозиторий (например, med-data) и токен GitHub с доступом «Contents: Read and write» только к нему. Без этого сайт работает, но без общих архивов и сеансов.</small>
 <div class="row" style="margin-top:12px"><input id="dr" placeholder="владелец/med-data" value="${esc(db0.repo||'')}" style="width:240px"><input id="dt" type="password" placeholder="токен GitHub" value="${esc(db0.token||'')}" style="width:300px"><input id="db" placeholder="ветка" value="${esc(db0.branch||'main')}" style="width:100px"><button class="btn ghost sm" id="dc">Проверить</button></div><div class="err" id="de"></div></div>
 <div class="card" style="margin-top:14px"><h3>Ключи доступа</h3><small>У сотрудников каждого отдела по 15 ключей (№1–15), у заведующих и администрации по одному.${fresh?` Новых ключей создано: ${fresh}. Они заработают после загрузки vault.json.`:''} Видны только Главному врачу.</small><div class="row" style="margin-top:10px"><button class="btn ghost sm" id="kd">Скачать список ключей (txt)</button></div>
 ${rl.map(r=>`<details class="k" style="margin-top:10px"><summary>${esc(r.dn)} · ${esc(r.name)} (${keys[r.id].length})</summary><table style="margin-top:8px">${keys[r.id].map((k,i)=>`<tr><td style="width:50px">№${i+1}</td><td><code id="k_${r.id}_${i}">${esc(k)}</code></td><td style="width:110px"><button class="btn ghost sm" data-kr="${r.id}|${i}">Сменить</button></td></tr>`).join('')}</table></details>`).join('')}</div>
 <div class="card" style="margin-top:14px"><h3>Сохранение настроек</h3><small>Сайт собирает файл vault.json, в котором вебхуки, ключи и параметры хранилища зашифрованы. Скачайте его и замените vault.json в репозитории сайта на GitHub, через 1–2 минуты изменения заработают.</small><div class="row" style="margin-top:12px"><button class="btn" id="mk">Создать vault.json</button></div><div class="err" id="me"></div></div>`;
 const okh=v=>/^(https:\/\/|http:\/\/localhost)[^\s]+\/api\/webhooks\/[^\s]+$/.test(v);
 document.querySelectorAll('[data-ht]').forEach(b=>b.onclick=async()=>{const id=b.dataset.ht,url=document.querySelector(`[data-h="${id}"]`).value.trim(),he=$('#he');he.className='err';he.textContent='';if(!okh(url)){he.textContent='Это не похоже на ссылку вебхука Discord.';sErr();return}
  const old=S.webhooks[id];S.webhooks[id]=url;b.disabled=true;try{await toDiscord({dept:id,deptName:CFG.departments.find(d=>d.id===id).name,title:'Проверка связи',id:'TEST',author:S.nick,roleName:ROLES[S.role].name,created:Date.now(),values:[{label:'Сообщение',value:'Тестовое сообщение портала MED Departaments'}]});he.className='err okmsg';he.textContent='Тестовое сообщение отправлено ✓';sOk()}catch(x){he.textContent=x.message;sErr()}S.webhooks[id]=old;b.disabled=false});
 const readDb=()=>{const repo=$('#dr').value.trim(),token=$('#dt').value.trim(),branch=$('#db').value.trim()||'main';if(!repo&&!token)return null;const o={repo,token,branch};if(db0.base)o.base=db0.base;return o};
 $('#dc').onclick=async()=>{const de=$('#de'),d=readDb();de.className='err';de.textContent='';if(!d||!/^[\w.-]+\/[\w.-]+$/.test(d.repo)||!d.token){de.textContent='Укажите репозиторий в виде владелец/имя и токен.';sErr();return}
  try{const sha=await gh.put('state/ping.json',JSON.stringify({t:Date.now()}),(await gh.meta('state/ping.json',d).catch(()=>null)||{}).sha,d);de.className='err okmsg';de.textContent='Хранилище работает ✓';sOk()}catch(x){de.textContent='Не получилось: '+x.message+'. Проверьте имя репозитория, токен и права «Contents: Read and write».';sErr()}};
 document.querySelectorAll('[data-kr]').forEach(b=>b.onclick=()=>{if(b.dataset.s!=='1'){b.dataset.s='1';b.textContent='Точно?';return}const[r,i]=b.dataset.kr.split('|'),k=genKey();keys[r][+i]=k;$(`#k_${r}_${i}`).textContent=k;b.textContent='Сменить';b.dataset.s='';sOk()});
 $('#kd').onclick=()=>{const t=rl.map(r=>keys[r.id].map((k,i)=>`${r.dn} | ${r.name} | №${i+1} | ${k}`).join('\n')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));a.download='keys.txt';a.click()};
 $('#mk').onclick=async()=>{const me=$('#me'),b=$('#mk');me.className='err';me.textContent='';const w={};
  for(const d of CFG.departments){const v=document.querySelector(`[data-h="${d.id}"]`).value.trim();if(v){if(!okh(v)){me.textContent='Неверная ссылка вебхука: '+d.name;sErr();return}w[d.id]=v}}
  const db=readDb();if(db&&(!/^[\w.-]+\/[\w.-]+$/.test(db.repo)||!db.token)){me.textContent='Проверьте параметры хранилища.';sErr();return}
  b.disabled=true;try{const v=await buildVault(keys,w,db,dk,(n,t)=>{b.textContent='Шифрование '+n+'/'+t+'…'}),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(v)],{type:'application/json'}));a.download='vault.json';a.click();me.className='err okmsg';me.textContent='Файл vault.json создан. Загрузите его в репозиторий на GitHub вместо старого.';sOk()}catch(x){me.textContent='Ошибка: '+x.message;sErr()}b.disabled=false;b.textContent='Создать vault.json'}}
// ---- старт ----
(async()=>{try{await load()}catch(e){app.innerHTML='<div class="sec"><p class="err">Не удалось загрузить настройки портала.</p></div>';return}
 if(S&&S.db&&S.sid){const d=await getRev();if(d&&kicked(d)){S=null;saveS();FLASH='Ваш сеанс был завершён администрацией.'}else startPoll()}
 navAuth();FLASH&&!S?auth():home()})();
